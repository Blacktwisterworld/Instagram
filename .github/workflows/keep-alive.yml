name: Keep Render Alive
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          URL="${{ secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then echo "RENDER_URL secret not set"; exit 0; fi
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" --max-time 60 "$URL/health" || true
