<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SQLite API Admin</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 1000px; margin: 40px auto; padding: 20px; background: #f5f7fa; color: #1a1a1a; }
  h1 { margin: 0 0 4px; }
  .sub { color: #666; margin-bottom: 24px; }
  .search-box { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 220px; padding: 10px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
  select { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  button { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
  button:disabled { background: #94a3b8; cursor: wait; }
  .result { background: #fff; padding: 20px; border-radius: 10px; margin-top: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow-x: auto; }
  .loading { color: #555; }
  .error { color: #b91c1c; }
  .empty { color: #666; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { background: #f1f5f9; }
  code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>🔍 SQLite API Admin</h1>
  <p class="sub">Remote DB (17M+ users) — powered by HTTP Range VFS</p>

  <div class="search-box">
    <input id="q" type="text" placeholder="Enter phone / email / username / id..." autocomplete="off" />
    <select id="field">
      <option value="any">Any field</option>
      <option value="phone">Phone</option>
      <option value="email">Email</option>
      <option value="username">Username</option>
      <option value="id">ID</option>
      <option value="name">Name</option>
    </select>
    <button id="btn">Search</button>
  </div>

  <div id="result" class="result">
    <p class="loading">Enter a value and hit Search. First query may take 10–30s (cold start).</p>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const btn = $('btn');

async function search() {
  const q = $('q').value.trim();
  const field = $('field').value;
  const result = $('result');
  if (!q) return;
  btn.disabled = true;
  result.innerHTML = '<p class="loading">⏳ Searching… (cold start may take up to 30s)</p>';
  const t0 = performance.now();
  try {
    const res = await fetch(`/search?q=${encodeURIComponent(q)}&field=${encodeURIComponent(field)}&limit=10`);
    const data = await res.json();
    const dt = (performance.now() - t0).toFixed(0);
    if (!res.ok) throw new Error(data.detail || 'Request failed');
    if (!data.results || data.results.length === 0) {
      result.innerHTML = `<p class="empty">No results for <b>${esc(q)}</b> in <b>${dt}ms</b>.</p>`;
      return;
    }
    let html = `<p><b>${data.count}</b> result(s) in <b>${dt}ms</b> (server: ${data.elapsed_ms}ms)</p>`;
    html += '<table><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Phone</th><th>Name</th><th>Address</th></tr></thead><tbody>';
    for (const r of data.results) {
      html += `<tr>
        <td>${esc(r.id)}</td><td>${esc(r.username)}</td><td>${esc(r.email)}</td>
        <td>${esc(r.phone)}</td><td>${esc(r.name)}</td><td>${esc(r.address)}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    result.innerHTML = html;
  } catch (e) {
    result.innerHTML = `<p class="error">❌ ${esc(e.message)}</p>`;
  } finally {
    btn.disabled = false;
  }
}

function esc(s) {
  return s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

btn.addEventListener('click', search);
$('q').addEventListener('keypress', e => { if (e.key === 'Enter') search(); });
</script>
</body>
</html>
